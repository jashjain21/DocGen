[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docgen"
version = "0.1.0"
description = "Offline PDF report generator"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "weasyprint",
    "pydantic",
    "pytest",
    "tqdm"
]